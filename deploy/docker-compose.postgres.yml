services:
  eoos-email:
    environment:
      EOOS_DB_DRIVER: postgres
      EOOS_DATABASE_URL: "postgres://${EOOS_POSTGRES_USER:-eoos}:${EOOS_POSTGRES_PASSWORD:?Set EOOS_POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${EOOS_POSTGRES_DATABASE:-eoos}?sslmode=disable"
      EOOS_DB_HOST: postgres
      EOOS_DB_PORT: "5432"
      EOOS_DB_NAME: "${EOOS_POSTGRES_DATABASE:-eoos}"
      EOOS_DB_USER: "${EOOS_POSTGRES_USER:-eoos}"
      EOOS_DB_PASSWORD: "${EOOS_POSTGRES_PASSWORD:?Set EOOS_POSTGRES_PASSWORD in deploy/.env}"
      EOOS_DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${EOOS_POSTGRES_DATABASE:-eoos}"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${EOOS_POSTGRES_ADMIN_PASSWORD:?Set EOOS_POSTGRES_ADMIN_PASSWORD in deploy/.env}"
      EOOS_POSTGRES_APP_USER: "${EOOS_POSTGRES_USER:-eoos}"
      EOOS_POSTGRES_APP_PASSWORD: "${EOOS_POSTGRES_PASSWORD:?Set EOOS_POSTGRES_PASSWORD in deploy/.env}"
    volumes:
      - eoos-postgres-data:/var/lib/postgresql/data
      - ./postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-eoos-app-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  eoos-postgres-data:
