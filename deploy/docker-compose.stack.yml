services:
  api:
    image: ${EOOS_API_IMAGE:-ghcr.io/weitie79-wq/eoos-email-api:latest}
    env_file: .env
    environment:
      EOOS_SMTP_HOST: ${EOOS_STACK_SMTP_HOST:-postfix}
      EOOS_SMTP_PORT: ${EOOS_STACK_SMTP_PORT:-25}
      EOOS_SUBMISSION_ADDR: ${EOOS_SUBMISSION_ADDR:-}
      EOOS_SUBMISSION_TLS_ADDR: ${EOOS_SUBMISSION_TLS_ADDR:-}
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts:ro
      # 生产环境如需第三方客户端校验证书，请取消下面挂载的注释，并在 .env 配置：
      # EOOS_TLS_CERT_FILE=/certs/fullchain.pem
      # EOOS_TLS_KEY_FILE=/certs/privkey.pem
      # - /etc/letsencrypt/live/${EOOS_PUBLIC_HOSTNAME}:/certs:ro
    ports:
      - "465:465"
      - "587:587"
    depends_on:
      - dovecot
      - postfix
    restart: unless-stopped

  web:
    image: ${EOOS_WEB_IMAGE:-ghcr.io/weitie79-wq/eoos-email-web:latest}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
    restart: unless-stopped

  postfix:
    image: ${EOOS_POSTFIX_IMAGE:-ghcr.io/weitie79-wq/eoos-email-postfix:latest}
    env_file: .env
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      # 生产环境如需第三方客户端校验证书，请取消下面挂载，并在 .env 配置：
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "25:25"
    depends_on:
      - dovecot
      - rspamd
    restart: unless-stopped

  dovecot:
    image: ${EOOS_DOVECOT_IMAGE:-ghcr.io/weitie79-wq/eoos-email-dovecot:latest}
    env_file: .env
    volumes:
      - ./data:/data
      - ./mail:/var/mail/vhosts
      # 生产环境如需第三方客户端校验证书，请取消下面挂载，并在 .env 配置：
      # EOOS_TLS_CERT_FILE=/etc/letsencrypt/live/mail.example.com/fullchain.pem
      # EOOS_TLS_KEY_FILE=/etc/letsencrypt/live/mail.example.com/privkey.pem
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "993:993"
      - "995:995"
    restart: unless-stopped

  rspamd:
    image: ${EOOS_RSPAMD_IMAGE:-ghcr.io/weitie79-wq/eoos-email-rspamd:latest}
    env_file: .env
    volumes:
      - ./data:/data:ro
      - ./dkim:/var/lib/rspamd/dkim
    restart: unless-stopped
