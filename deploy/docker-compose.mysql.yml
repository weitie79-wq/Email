services:
  eoos-email:
    environment:
      EOOS_DB_DRIVER: mysql
      EOOS_DATABASE_URL: "${EOOS_MYSQL_USER:-eoos}:${EOOS_MYSQL_PASSWORD:?Set EOOS_MYSQL_PASSWORD in deploy/.env}@tcp(mysql:3306)/${EOOS_MYSQL_DATABASE:-eoos}?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci"
      EOOS_DB_HOST: mysql
      EOOS_DB_PORT: "3306"
      EOOS_DB_NAME: "${EOOS_MYSQL_DATABASE:-eoos}"
      EOOS_DB_USER: "${EOOS_MYSQL_USER:-eoos}"
      EOOS_DB_PASSWORD: "${EOOS_MYSQL_PASSWORD:?Set EOOS_MYSQL_PASSWORD in deploy/.env}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${EOOS_MYSQL_DATABASE:-eoos}"
      MYSQL_USER: "${EOOS_MYSQL_USER:-eoos}"
      MYSQL_PASSWORD: "${EOOS_MYSQL_PASSWORD:?Set EOOS_MYSQL_PASSWORD in deploy/.env}"
      MYSQL_ROOT_PASSWORD: "${EOOS_MYSQL_ROOT_PASSWORD:?Set EOOS_MYSQL_ROOT_PASSWORD in deploy/.env}"
    volumes:
      - eoos-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  eoos-mysql-data:
